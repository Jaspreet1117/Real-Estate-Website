<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schedule & Contact</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(0, 0, 0, 0.6);
      z-index: 999;
      transition: background 0.3s ease;
    }

    nav.scrolled {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
    }

    nav .logo img {
      height: 50px;
    }

    nav .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav .nav-links li a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    nav .nav-links li a:hover {
      color: #ffcc00;
    }

    .toggle-btn {
      color: #fff;
      background: none;
      border: 2px solid #fff;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .toggle-btn:hover {
      background: #ffcc00;
      color: #000;
    }

    body.dark nav {
      background: rgba(255, 255, 255, 0.1);
    }
    body.dark .toggle-btn {
      border-color: #ffcc00;
      color: #ffcc00;
    }

    /* TIME BOX */
    #time {
      margin-top: 85px;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      background: #f1f1f1;
      color: #000;
    }

    /* CONTACT SECTION */
    .contact-section {
      text-align: center;
      padding: 50px 20px;
      background: url('https://images.unsplash.com/photo-1506765515384-028b60a970df')
        no-repeat center center/cover;
      border-radius: 15px;
      width: 80%;
      margin: 30px auto;
      color: white;
    }

    .contact-section h2 {
      font-size: 34px;
      font-weight: 800;
      color: #0073e6;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
      margin-bottom: 15px;
    }

    .contact-section p {
      font-size: 18px;
      font-weight: 600;
      color: #f8f8f8;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
      margin-bottom: 30px;
    }

    /* FORM */
    .contact-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .contact-form .form-row {
      display: flex;
      gap: 20px;
      width: 95%;
    }

    .contact-form .form-row input {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .contact-form button {
      width: 95%;
      padding: 15px;
      background: linear-gradient(90deg, #0073e6, #005bb5);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-form button:hover {
      background: linear-gradient(90deg, #005bb5, #003f80);
    }

    /* CONTACT INFO */
    .contact-info {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 0 auto;
      width: 100%;
      flex-wrap: wrap;
      padding: 50px 20px;
      background: linear-gradient(135deg, #f8f9fa, #e3f2fd);
    }

    .info-box {
      flex: 1;
      min-width: 250px;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .info-box i {
      font-size: 28px;
      margin-bottom: 10px;
      display: block;
    }

    .info-box.address i {
      color: red;
    }
    .info-box.phone i {
      color: green;
    }
    .info-box.email i {
      color: blue;
    }

    .info-box h3 {
      margin: 10px 0;
      font-size: 20px;
      font-weight: bold;
    }

    .info-box p {
      font-size: 16px;
      color: #333;
    }

    .info-box.address a {
      color: blue;
      text-decoration: none;
    }

    .info-box.address a:hover {
      text-decoration: underline;
    }

    .info-box.email a {
      color: #0073e6;
      text-decoration: none;
      font-weight: bold;
    }

    .info-box.email a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- ✅ NAVBAR -->
  <nav>
    <a href="#" class="logo">
      <img
        id="logo"
        src="../images/WhatsApp_Image_2025-09-08_at_14.32.09_af6a30c5-removebg-preview.png"
        alt="HOMEFINDER"
      />
    </a>
    <ul class="nav-links">
      <li><a href="htmls/loginPage.html">Login</a></li>
      <li><a href="htmls/signup.html">Sign up</a></li>
      <li><a href="htmls/aboutUs.html">About Us</a></li>
      <li><a href="htmls/contactUs.html">Contact</a></li>
    </ul>
    <button class="toggle-btn">🌙</button>
  </nav>

  <!-- ✅ CLOCK -->
  <div id="time"></div>

  <!-- CONTACT SECTION -->
  <section class="contact-section">
    <h2>Schedule a Meeting</h2>
    <p>Have any question?<br />Let's start the conversation</p>

    <form class="contact-form">
      <div class="form-row">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email ID" required />
      </div>
      <div class="form-row">
        <input type="text" placeholder="Number" required />
        <input type="text" placeholder="Message" required />
      </div>
      <button type="submit">SEND MESSAGE</button>
    </form>
  </section>

  <!-- CONTACT INFO -->
  <div class="contact-info">
    <div class="info-box address">
      <i class="fas fa-map-marker-alt"></i>
      <h3>Address</h3>
      <p>
        <a
          href="https://www.google.com/maps/place/Chitkara+University,+Punjab/@30.516086,76.6598169,17z"
          target="_blank"
          title="Open in Google Maps"
        >
          Chitkara University, Punjab Campus<br />
          Chandigarh–Patiala National Highway (NH-64), Rajpura, Punjab 140401
        </a>
      </p>
    </div>

    <div class="info-box phone">
      <i class="fas fa-phone"></i>
      <h3>Phone</h3>
      <p>+91 90000-00000</p>
    </div>

    <div class="info-box email">
      <i class="fas fa-envelope"></i>
      <h3>Email</h3>
      <p>
        <a
          href="mailto:xyzlimited@gmail.com?subject=Inquiry&body=Hello, I would like to know more about your services."
        >
          Send me an email!
        </a>
      </p>
    </div>
  </div>

  <script>
    /* 🔹 NAVBAR BEHAVIOR */
    window.addEventListener("scroll", () => {
      const nav = document.querySelector("nav");
      if (window.scrollY > 50) nav.classList.add("scrolled");
      else nav.classList.remove("scrolled");
    });

    const toggleBtn = document.querySelector(".toggle-btn");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      toggleBtn.textContent = document.body.classList.contains("dark")
        ? "☀️"
        : "🌙";
    });

    /* 🔹 CLOCK */
    function updateTime() {
      const now = new Date();
      document.getElementById("time").innerText = now.toLocaleString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    /* 🔹 FORM + TOAST + VALIDATION (unchanged) */
    const toast = document.createElement("div");
    toast.id = "toast";
    toast.textContent = "Message Sent Successfully 🎉";
    toast.style.cssText = `
      display:none;position:fixed;bottom:20px;right:20px;
      background:#0073e6;color:white;padding:15px 20px;
      border-radius:10px;font-weight:bold;
      box-shadow:0 2px 6px rgba(0,0,0,0.3);
      opacity:0;transition:opacity 0.5s ease;
    `;
    document.body.appendChild(toast);

    const form = document.querySelector(".contact-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const inputs = form.querySelectorAll("input");
      let valid = true;

      inputs.forEach((input) => {
        if (input.value.trim() === "") {
          input.style.border = "2px solid red";
          valid = false;
        } else {
          input.style.border = "2px solid green";
        }
      });

      if (valid) {
        toast.style.display = "block";
        setTimeout(() => (toast.style.opacity = 1), 10);
        setTimeout(() => {
          toast.style.opacity = 0;
          setTimeout(() => (toast.style.display = "none"), 500);
        }, 3000);
        form.reset();
      } else {
        alert("⚠️ Please fill out all fields before submitting.");
      }
    });

    /* 🔹 RESTRICT NUMBER INPUT */
    const numInput = Array.from(document.querySelectorAll(".contact-form input"))
      .find((inp) => inp.placeholder === "Number");
    if (numInput) {
      numInput.addEventListener("input", () => {
        numInput.value = numInput.value.replace(/[^0-9]/g, "");
      });
    }

    /* 🔹 SCROLL ANIMATION */
    const boxes = document.querySelectorAll(".info-box");
    boxes.forEach((box) => {
      box.style.opacity = 0;
      box.style.transform = "translateY(30px)";
    });
    window.addEventListener("scroll", () => {
      boxes.forEach((box) => {
        const boxTop = box.getBoundingClientRect().top;
        if (boxTop < window.innerHeight - 100) {
          box.style.transition = "opacity 1s ease, transform 1s ease";
          box.style.opacity = 1;
          box.style.transform = "translateY(0)";
        }
      });
    });

    /* 🔹 PARALLAX */
    window.addEventListener("scroll", () => {
      const section = document.querySelector(".contact-section");
      const offset = window.scrollY * 0.4;
      section.style.backgroundPositionY = offset + "px";
    });

    /* 🔹 SCROLL TO TOP */
    const topBtn = document.createElement("button");
    topBtn.id = "topBtn";
    topBtn.innerHTML = "↑";
    topBtn.style.cssText = `
      position:fixed;bottom:30px;right:30px;display:none;
      background:#0073e6;color:#fff;border:none;padding:10px;
      border-radius:50%;font-size:20px;cursor:pointer;
    `;
    document.body.appendChild(topBtn);
    window.addEventListener("scroll", () => {
      topBtn.style.display = window.scrollY > 200 ? "block" : "none";
    });
    topBtn.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* 🔹 COPY EMAIL */
    const emailLink = document.querySelector(".info-box.email a");
    if (emailLink) {
      emailLink.addEventListener("click", (e) => {
        e.preventDefault();
        navigator.clipboard.writeText("xyzlimited@gmail.com");
        alert("📋 Email address copied to clipboard!");
      });
    }
  </script>
</body>
</html>
