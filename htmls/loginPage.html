<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="../css/loginPage.css">
</head>
<body>
  <div id="loginSuccess" class="alert alert-success fade" role="alert" style="display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:10;">
    🎉 Login successful! Redirecting...
  </div>
  <div id="loginError" class="alert alert-danger fade" role="alert" style="display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%); z-index:10;">
    ❌ Invalid username/email or password
  </div>

  <div class="overlay custom">
    <div class="card">
      <h1>HomeFindr</h1>
      <form>
        <input type="text" placeholder="Username or Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <div class="links">
          <a id="forgotLink">Forgot Password?</a> | 
          <a href="signup.html">Sign Up</a>
        </div>
      </form>
    </div>
    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('forgotModal')">&times;</span>
        <h2>Reset Password</h2>
        <input type="email" placeholder="Enter your email" required>
        <button>Send Reset Link</button>
      </div>
    </div>
    <!-- Sign Up Modal -->
    <div id="signupModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('signupModal')">&times;</span>
        <h2>Create Account</h2>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button>Sign Up</button>
      </div>
      
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javascript/loginPage.js"></script>
</body>
</html>
