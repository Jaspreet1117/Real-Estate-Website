<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Form</title>

  <style>
    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dbeafe, #bfdbfe);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== Container ===== */
    .feedback-box {
      width: 80%;
      max-width: 950px;
      display: flex;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== Left Panel ===== */
    .left {
      flex: 1;
      background: linear-gradient(135deg, #2563eb, #1e3a8a);
      color: #fff;
      padding: 50px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left h2 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .left p {
      font-size: 18px;
      opacity: 0.9;
    }

    /* ===== Right Panel ===== */
    .right {
      flex: 2;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .right h3 {
      font-size: 22px;
      color: #111;
      margin-bottom: 10px;
    }

    .property {
      color: #444;
      font-weight: 500;
      margin-bottom: 15px;
    }

    /* ===== Face Emoji Rating ===== */
    .stars {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 28px;
      cursor: pointer;
      justify-content: start;
    }

    .stars span {
      transition: transform 0.2s;
    }

    /* ===== Question ===== */
    .question {
      font-size: 18px;
      color: #333;
      margin: 15px 0;
    }

    /* ===== Buttons ===== */
    .btn-group {
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 12px 35px;
      border-radius: 30px;
      border: 2px solid #2563eb;
      background: none;
      color: #2563eb;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #2563eb;
      color: #fff;
      transform: translateY(-2px);
    }

    /* ===== Textarea ===== */
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 25px;
      padding: 15px;
      border-radius: 10px;
      border: 1.5px solid #ccc;
      font-size: 16px;
      resize: none;
      transition: border 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* ===== Submit Button ===== */
    .submit-btn {
      margin-top: 25px;
      align-self: flex-start;
      background: linear-gradient(90deg, #2563eb, #1e3a8a);
      border: none;
      padding: 12px 35px;
      border-radius: 30px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: linear-gradient(90deg, #1e3a8a, #172554);
    }

    /* ===== Toast Message ===== */
    #toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #2563eb;
      color: #fff;
      padding: 15px 25px;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      display: none;
      transition: opacity 0.5s ease;
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .feedback-box {
        flex-direction: column;
        width: 90%;
      }

      .left,
      .right {
        padding: 30px;
        text-align: center;
      }

      .btn-group {
        justify-content: center;
      }

      .submit-btn {
        align-self: center;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="feedback-box">
    <!-- LEFT SIDE -->
    <div class="left">
      <h2>Give us<br />Feedback</h2>
      <p>We value your opinion to help us improve your experience.</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
      <h3>You are giving feedback :</h3>
      <p class="property">
        <strong> </strong>
      </p>

      <!-- FACE EMOJI RATING -->
      <div class="stars">
        <span data-value="1">😡</span>
        <span data-value="2">😕</span>
        <span data-value="3">😐</span>
        <span data-value="4">🙂</span>
        <span data-value="5">😄</span>
      </div>

      <div class="question">Was the information by the owner correct?</div>
      <div class="btn-group">
        <button class="btn" id="yesBtn">Yes</button>
        <button class="btn" id="noBtn">No</button>
      </div>

      <textarea id="commentBox" placeholder="Any additional comments..."></textarea>
      <button class="submit-btn" id="submitBtn">Submit Feedback</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast">✅ Thank you for your feedback!</div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const submitBtn = document.getElementById("submitBtn");
    const toast = document.getElementById("toast");
    const commentBox = document.getElementById("commentBox");
    const stars = document.querySelectorAll(".stars span");

    let selected = "";
    let rating = 0;

    // Face Emoji Rating Logic
    stars.forEach((emoji, idx) => {
      emoji.addEventListener("click", () => {
        rating = idx + 1;
        stars.forEach((e, i) => {
          e.style.transform = i < rating ? "scale(1.5)" : "scale(1)";
        });
      });
    });

    // Yes/No Buttons
    yesBtn.addEventListener("click", () => {
      yesBtn.style.background = "#2563eb";
      yesBtn.style.color = "#fff";
      noBtn.style.background = "none";
      noBtn.style.color = "#2563eb";
      selected = "Yes";
    });

    noBtn.addEventListener("click", () => {
      noBtn.style.background = "#2563eb";
      noBtn.style.color = "#fff";
      yesBtn.style.background = "none";
      yesBtn.style.color = "#2563eb";
      selected = "No";
    });

    // Submit Button Logic
    submitBtn.addEventListener("click", () => {
      if (!rating) {
        alert("😄 Please select a face rating before submitting.");
        return;
      }

      if (!selected) {
        alert("⚠️ Please select Yes or No before submitting.");
        return;
      }

      // ✅ Center Success Message
      Swal.fire({
        icon: 'success',
        title: 'Thank You for Your Feedback!',
        text: 'We appreciate your time and input.',
        confirmButtonColor: '#2563eb'
      });

      // Reset form
      rating = 0;
      selected = "";
      stars.forEach((e) => e.style.transform = "scale(1)");
      yesBtn.style.background = noBtn.style.background = "none";
      yesBtn.style.color = noBtn.style.color = "#2563eb";
      commentBox.value = "";
    });
  </script>
</body>
</html>
